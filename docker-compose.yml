services:
  site1:
    build:
      context: /opt/sites/site1
    networks:
      - sites-network

  site2:
    build:
      context: /opt/sites/site2
    networks:
      - sites-network

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - /opt/stack/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site1
      - site2
    networks:
      - sites-network

networks:
  sites-network: